package: py-SCORPIUS
upstream:
  name: SCORPIUS
  version: "1.0.9"
  source: CRAN
  url: https://github.com/rcannood/SCORPIUS

algorithm_class: ordinal
parity_threshold: 0.95   # Pearson on pseudotime; relaxed from 0.99 default
                         # because principal-curve init via kmeans+TSP is
                         # RNG-sensitive and Python's scipy MDS differs from
                         # R's lmds in landmark selection.

fixture:
  path: data/fixture_simdata.rds
  source: SCORPIUS::generate_dataset(num_genes=200, num_samples=400, num_groups=4, seed=42)
  expected_shape: [400, 200]

reference_command: tests/r_reference_driver.R
seed: 42

outputs:
  - name: pseudotime
    type: "1d vector per cell"
    location_reference: "$.pseudotime"
    location_candidate: "pseudotime"
    metric: ordinal
    threshold: 0.95
  - name: low_dim_space
    type: "n_cells x ndim matrix"
    location_reference: "$.space"
    location_candidate: "space"
    metric: embedding
    threshold: 0.85   # Procrustes; relaxed from 0.95 due to MDS-vs-LMDS divergence

acceleration:
  enabled: false
  max_iterations: 0

created_by: claude-opus-4-7 via omicverse-rebuildr kit
created_at: 2026-05-24
